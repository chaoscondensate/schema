name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Verify release candidate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "${RELEASE_TAG}")" = "tag"
          test "v$(python -c 'import json; print(json.load(open("schema/forecast-ledger.schema.json"))["properties"]["schema_version"]["const"])')" = "${RELEASE_TAG}"
          check-jsonschema --check-metaschema schema/*.schema.json
          python tools/run_fixture_tests.py
          python tools/forecast_crypto.py verify-vector tests/vectors/forecast-seal-v3.json
          python tools/forecast_crypto.py verify-key-vector tests/vectors/forecast-key-v3.json
          python tools/forecast_crypto.py verify-target-vector tests/vectors/forecast-envelope-v3-public-lifecycle.json
          python tools/forecast_crypto.py verify-target-vector tests/vectors/forecast-envelope-v3-sealed-lifecycle.json
          python tools/forecast_crypto.py verify-lifecycle-vector tests/vectors/forecast-lifecycle-v2.json
          python tools/forecast_crypto.py verify-presence-vector tests/vectors/forecast-seal-v3-presence.json
          python tools/sidecar_contracts.py tests/vectors/forecast-evidence-index-v1*.json tests/vectors/forecast-ledger-publication-v3*.json
          python tools/run_target_tests.py
          python tools/run_seal_tests.py
          python tools/run_sidecar_tests.py
          python tools/run_transition_tests.py
          python tools/run_diagnostic_tests.py
          python tools/generate_vectors.py
          git diff --exit-code
          ruff check tools

      - name: Build release archive and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          RELEASE_COMMIT=$(git rev-parse "${RELEASE_TAG}^{commit}")
          git archive --format=tar.gz \
            --prefix="forecast-ledger-schema-${RELEASE_TAG}/" \
            --output="dist/forecast-ledger-schema-${RELEASE_TAG}.tar.gz" \
            "${RELEASE_COMMIT}"
          cp schema/forecast-ledger.schema.json \
            "dist/forecast-ledger-${RELEASE_TAG}.schema.json"
          cp schema/forecast-key.schema.json \
            "dist/forecast-key-${RELEASE_TAG}.schema.json"
          cp schema/forecast-evidence-index.schema.json \
            "dist/forecast-evidence-index-${RELEASE_TAG}.schema.json"
          cp schema/forecast-ledger-publication.schema.json \
            "dist/forecast-ledger-publication-${RELEASE_TAG}.schema.json"
          cp examples/valid/individual-ledger.json \
            "dist/forecast-ledger-${RELEASE_TAG}.example.json"
          cp examples/valid/team-ledger.yaml \
            "dist/forecast-ledger-${RELEASE_TAG}.example.yaml"
          cd dist
          sha256sum * > SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/releases/${RELEASE_TAG#v}.md"
          if [[ -f "${NOTES_FILE}" ]]; then
            NOTES_ARGS=(--notes-file "${NOTES_FILE}")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "${RELEASE_TAG}" \
            --verify-tag \
            "${NOTES_ARGS[@]}" \
            --title "Forecast Ledger ${RELEASE_TAG}" \
            dist/*
